services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: igx_bot
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_FILE=config.yml
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
      - ./cookies:/app/cookies
      - ./chrome_extensions:/app/chrome_extensions
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s